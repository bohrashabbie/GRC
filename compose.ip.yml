# Reach the stack by IP over plain HTTP, before DNS is mapped.
#
#   docker compose --env-file .env.vps -f compose.yml -f compose.ip.yml up -d --build
#
#   http://<PUBLIC_HOST>        storefront
#   http://<PUBLIC_HOST>:3000   admin panel
#   http://<PUBLIC_HOST>:8000   API — /api/v1, /shop/v1, /uploads
#
# No reverse proxy in this mode. Each container publishes its own port, so the
# browser talks to it directly and there is nothing listening on 443 that could
# redirect http:// to https://. Caddy stays behind the "proxy" Compose profile
# and does not start unless `--profile proxy` is passed.
#
# Because there is no proxy folding everything onto one origin, the admin panel
# and the storefront call the API cross-origin. That is why the API's CORS
# origins below list the exact ports, and why PUBLIC_MEDIA_BASE_URL points at
# :8000 — product images are served by the API's /uploads mount, not by Next.
#
# Requires PUBLIC_HOST in .env.vps, set to the VPS public IPv4 address.
#
# The `--build` is required, not optional. Next.js compiles
# NEXT_PUBLIC_API_BASE_URL into the browser bundle, so the admin image is pinned
# to whichever origin it was built for.
#
# There is no TLS here: the owner login and every API call travel in cleartext.
# Restrict ports 3000 and 8000 to your own IP at the VPS firewall.

services:
  api:
    environment:
      PUBLIC_MEDIA_BASE_URL: http://${PUBLIC_HOST:?Set PUBLIC_HOST in .env.vps}:8000
      ADMIN_CORS_ORIGINS: '["http://${PUBLIC_HOST}:3000"]'
      STOREFRONT_CORS_ORIGINS: '["http://${PUBLIC_HOST}"]'
    ports:
      - "8000:8000"

  admin:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: http://${PUBLIC_HOST}:8000/api/v1
    environment:
      AUTH_COOKIE_SECURE: "0"
    ports:
      - "3000:3000"

  storefront:
    environment:
      NEXT_PUBLIC_SITE_URL: http://${PUBLIC_HOST}
    ports:
      - "80:3100"
